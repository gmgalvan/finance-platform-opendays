# Prometheus para la demo: descubre los pods de la app por sus anotaciones.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Cualquier pod del namespace finance con estas anotaciones se recolecta solo:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port:   "8000"
  #   prometheus.io/path:   "/metrics"
  - job_name: finance-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [finance]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
      # Versión desplegada, tomada de la etiqueta de la imagen (sha-<commit>).
      - source_labels: [__meta_kubernetes_pod_container_image]
        regex: '.*:(.+)'
        target_label: version
