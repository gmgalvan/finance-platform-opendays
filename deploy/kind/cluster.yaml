# Clúster local de Kubernetes para la demo.
# El NodePort 30080 del frontend queda disponible en http://localhost:8090
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: finance
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
