apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/gmgalvan/finance-platform-frontend
          ports:
            - name: http
              containerPort: 80
          # Trazas de Nginx y del navegador hacia Jaeger (namespace monitoring).
          env:
            - name: OTEL_TRACE
              value: "on"
            - name: OTEL_EXPORTER_ENDPOINT
              value: jaeger.monitoring.svc.cluster.local:4317
            - name: OTLP_HTTP_COLLECTOR
              value: http://jaeger.monitoring.svc.cluster.local:4318
          readinessProbe:
            httpGet:
              path: /health/frontend
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/frontend
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          # Al apagarse, el pod sigue atendiendo unos segundos mientras
          # Kubernetes lo retira del Service; así no se cortan conexiones.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
